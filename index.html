<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Biên Tập & Viết Truyện (Gemini 3.5 Flash)</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; background-color: #f0f2f5; }
        .container { background-color: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1 { color: #202124; text-align: center; }
        label { font-weight: 600; display: block; margin-top: 20px; margin-bottom: 8px; color: #3c4043; }
        input[type="text"], input[type="password"], textarea { width: 100%; padding: 12px; border: 1px solid #dadce0; border-radius: 6px; box-sizing: border-box; font-family: inherit; font-size: 15px;}
        input:focus, textarea:focus { outline: none; border-color: #1a73e8; box-shadow: 0 0 0 2px rgba(26,115,232,0.2); }
        textarea { height: 200px; resize: vertical; line-height: 1.5; }
        button { background-color: #1a73e8; color: white; padding: 14px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 25px; width: 100%; transition: background 0.3s; }
        button:hover { background-color: #1557b0; }
        #result { margin-top: 25px; padding: 20px; border: 1px solid #dadce0; border-radius: 6px; background-color: #f8f9fa; min-height: 150px; white-space: pre-wrap; line-height: 1.7; font-size: 16px; color: #202124; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #1a73e8; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .note { color: #d93025; font-size: 0.9em; background: #fce8e6; padding: 10px; border-radius: 4px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI Viết Truyện Từ Bản Raw ✍️</h1>
        
        <div class="note">
            <strong>Lưu ý:</strong> Cần nhập Gemini API Key để công cụ hoạt động. (Lấy API Key miễn phí tại <a href="https://aistudio.google.com/app/apikey" target="_blank">Google AI Studio</a>). Code chạy 100% trên trình duyệt của bạn, không lưu lại Key.
        </div>

        <label for="apiKey">Gemini API Key của bạn:</label>
        <input type="password" id="apiKey" placeholder="Dán API Key vào đây...">

        <label for="prompt">Yêu cầu biên tập (Prompt):</label>
        <input type="text" id="prompt" value="Hãy đóng vai một nhà văn chuyên nghiệp. Viết lại đoạn raw sau thành một chương truyện hoàn chỉnh, câu cú mượt mà, giữ nguyên cốt truyện, miêu tả sinh động nội tâm và cảnh vật:">

        <label for="rawText">Dán bản Raw vào đây:</label>
        <textarea id="rawText" placeholder="Dán văn bản raw vào đây..."></textarea>

        <button onclick="generateStory()">✨ Bắt Đầu Viết Truyện (Model 3.5 Flash)</button>
        <div id="loading" class="loader"></div>

        <label>Kết quả từ AI:</label>
        <div id="result">Truyện sau khi được AI viết sẽ hiển thị ở đây...</div>
    </div>

    <script>
        async function generateStory() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const prompt = document.getElementById('prompt').value.trim();
            const rawText = document.getElementById('rawText').value.trim();
            const resultDiv = document.getElementById('result');
            const loadingDiv = document.getElementById('loading');

            if (!apiKey) {
                alert("Vui lòng nhập Gemini API Key!");
                return;
            }
            if (!rawText) {
                alert("Vui lòng nhập bản raw cần viết!");
                return;
            }

            resultDiv.innerText = "";
            loadingDiv.style.display = "block";

            const fullPrompt = `${prompt}\n\n[BẢN RAW BẮT ĐẦU]\n${rawText}\n[BẢN RAW KẾT THÚC]`;
            
            try {
                // Đã cập nhật url gọi trực tiếp model gemini-3.5-flash
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: fullPrompt }] }],
                        generationConfig: {
                            temperature: 0.7 
                        }
                    })
                });

                const data = await response.json();
                loadingDiv.style.display = "none";

                if (data.error) {
                    resultDiv.innerText = "Lỗi API: " + data.error.message;
                } else if (data.candidates && data.candidates[0].content) {
                    const text = data.candidates[0].content.parts[0].text;
                    resultDiv.innerText = text;
                } else {
                    resultDiv.innerText = "Lỗi không xác định, không thể tạo nội dung.";
                }
            } catch (error) {
                loadingDiv.style.display = "none";
                resultDiv.innerText = "Đã xảy ra lỗi kết nối: " + error.message;
            }
        }
    </script>
</body>
</html>
